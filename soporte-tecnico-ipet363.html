<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Soporte técnico · IPET N.º 363</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
/* ==========================================================================
   1. VARIABLES Y BASE
   ========================================================================== */
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Colores generales */
  --bg: #edf0f4;      /* fondo de la página */
  --card: #fff;       /* fondo de tarjetas */
  --tx: #1b2a3f;      /* texto principal */
  --mu: #6b7a90;      /* texto secundario */
  --bd: #e4e9f0;      /* bordes */
  --side: #172b45;    /* barra lateral */
  --pr: #2a5b8c;      /* color principal */
  --inp: #fff;        /* fondo de inputs */

  /* Colores de estado y prioridad */
  --pen: #7d95b0;     /* Pendiente */
  --rev: #5a82ae;     /* En revisión */
  --rep: #3a6a9b;     /* En reparación */
  --sol: #1f4a76;     /* Solucionado */
  --alta: #b4534a;    /* Prioridad alta / errores */
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  display: grid;
  grid-template-columns: 230px 1fr;   /* barra lateral + contenido */
  min-height: 100vh;
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}

h1 { margin: 0 0 6px; font-size: 28px; font-weight: 500; letter-spacing: -.01em; }
h2 { margin: 0 0 2px; font-size: 16px; font-weight: 500; }
.mu, small { color: var(--mu); font-size: 13px; }
small { display: block; }

/* Etiqueta chica en mayúsculas (sobre los títulos) */
.k {
  margin: 0 0 8px;
  color: var(--pr);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .09em;
}
label.k { display: block; color: var(--mu); }

/* Íconos SVG en línea */
.ico {
  width: 16px; height: 16px;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ==========================================================================
   2. BARRA LATERAL
   ========================================================================== */
aside {
  position: sticky; top: 0;
  display: flex; flex-direction: column; gap: 6px;
  height: 100vh; padding: 20px 14px;
  background: var(--side); color: #cfd9e8;
}

.logo { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; color: #fff; }
.logo i {
  display: grid; place-items: center;
  width: 34px; height: 34px; padding: 0;
  border: 1.5px solid #cfd9e8; border-radius: 9px;
  font-style: normal; font-size: 11px; font-weight: 700;
}
.logo b { display: block; font-size: 13px; }
.logo small { color: #93a3b8; font-size: 11px; }

nav a {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: 8px;
  color: #cfd9e8; font-size: 14px; cursor: pointer;
}
nav a:hover { background: rgba(255,255,255,.07); }
nav a.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }

.help {
  display: flex; gap: 8px; align-items: flex-start;
  margin-top: auto; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.12);
  color: #93a3b8; font-size: 11px;
}
.help b { display: block; color: #cfd9e8; font-size: 12px; }
.help small { color: #93a3b8; font-size: 11px; }

/* Círculo con "?" */
.q {
  flex: none; display: grid; place-items: center;
  width: 16px; height: 16px;
  border: 1.5px solid currentColor; border-radius: 50%;
  font-size: 10px; font-weight: 700;
}

/* ==========================================================================
   3. BARRA SUPERIOR Y CONTENEDOR PRINCIPAL
   ========================================================================== */
.mw { min-width: 0; }

.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  height: 54px; padding: 0 28px;
  background: var(--card); border-bottom: 1px solid var(--bd);
}

.sb { position: relative; width: min(330px, 100%); }   /* buscador */
.sb .ico { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; color: var(--mu); }
.sb input { padding: 7px 10px 7px 32px; font-size: 13px; }

.us { display: flex; gap: 10px; align-items: center; font-size: 13px; }  /* usuario */
.us b { display: block; line-height: 1.2; }
.us small { font-size: 11px; }
.av {
  display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--pr); color: #fff; font-size: 11px; font-weight: 700;
}
.out {
  margin-left: 6px; padding: 6px 10px;
  background: none; border: 1px solid var(--bd); border-radius: 6px;
  color: var(--tx); font: inherit; font-size: 12px; cursor: pointer;
}

/* El ancho máximo cambia según la vista (la clase es "v-" + nombre de la vista) */
main { width: 100%; max-width: 860px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 40px); }
.v-home   { max-width: 940px; }
.v-list   { max-width: 980px; }
.v-form   { max-width: 640px; }
.v-detail { max-width: 900px; }

/* Encabezado de cada vista */
.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.v-detail .hd { padding-bottom: 18px; border-bottom: 1px solid var(--bd); }
.hd2 { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 8px 0 12px; }
.hd2 .k { margin-bottom: 4px; }

a.back { display: inline-block; margin-bottom: 14px; color: var(--pr); font-size: 13px; cursor: pointer; }
.em { margin: 0; padding: 18px 4px; color: var(--mu); }   /* mensaje de "no hay nada" */

/* ==========================================================================
   4. COMPONENTES: botones, paneles, tarjetas, badges, formularios
   ========================================================================== */
.btn {
  padding: 9px 16px; border: 0; border-radius: 6px;
  background: var(--pr); color: #fff;
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn.sec { background: transparent; color: var(--tx); border: 1px solid var(--bd); }

/* Panel blanco con encabezado (.ph) */
.pn { margin-bottom: 18px; padding: 18px; overflow: hidden; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; }
.ph {
  margin: -18px -18px 8px; padding: 16px 18px;
  background: color-mix(in srgb, var(--tx) 3%, var(--card));
  border-bottom: 1px solid var(--bd);
}
.ph.ft { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.fs { display: flex; gap: 8px; flex-wrap: wrap; }          /* filtros de la lista */
.fs select { width: auto; padding: 6px 8px; font-size: 12px; }

/* Tarjetas de números del inicio */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 18px; }
.card { display: flex; gap: 12px; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; }
.card b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
.ic {
  flex: none; display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--pr); background: color-mix(in srgb, var(--pr) 10%, var(--card));
}

/* Badges de estado y prioridad: cada clase define el color del puntito (--c) */
.b {
  display: inline-flex; gap: 6px;
  padding: 2px 10px; border: 1px solid var(--bd); border-radius: 99px;
  color: var(--tx); font-size: 11px; font-weight: 500; white-space: nowrap;
}
.b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pen   { --c: var(--pen); }
.rev   { --c: var(--rev); }
.rep   { --c: var(--rep); }
.sol   { --c: var(--sol); }
.Alta  { --c: var(--alta); }
.Media { --c: var(--pen); }
.Baja  { --c: var(--mu); }

/* Formularios */
input, select, textarea {
  width: 100%; padding: 9px 10px;
  background: var(--inp); color: var(--tx);
  border: 1px solid var(--bd); border-radius: 8px; font: inherit;
}
textarea { min-height: 100px; resize: vertical; }
label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
nav a:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--pr); outline-offset: 2px;
}

.f  { margin-bottom: 14px; }                                   /* campo */
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two { display: grid; grid-template-columns: 1.8fr 1fr; gap: 18px; align-items: start; }
.req { color: var(--alta); }
.err { min-height: 20px; color: var(--alta); font-size: 13px; }

/* Pasos numerados del formulario */
.sh { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.n {
  flex: none; display: grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: color-mix(in srgb, var(--pr) 16%, var(--card)); color: var(--pr);
  font-size: 11px; font-weight: 700;
}
.ba { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--bd); }

/* ==========================================================================
   5. VISTAS
   ========================================================================== */

/* --- Inicio: barra de estados y tiles de actividad reciente --- */
.sg { display: flex; height: 30px; margin: 6px 0 14px; overflow: hidden; border-radius: 8px; }
.sg span { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; }
.lgr { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
.lgr i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; padding: 14px;
  background: var(--card); border: 1px solid var(--bd); border-radius: 12px; cursor: pointer;
}
.tile .tt, .tile .tf { display: flex; justify-content: space-between; align-items: center; }
.tile b { font-size: 15px; font-weight: 600; }
.tile:hover, .te:hover { box-shadow: 0 4px 14px rgba(20, 33, 61, .1); }

/* --- Solicitudes: chips de estado + tarjetas --- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
.ch2 {
  padding: 6px 14px; background: transparent; color: var(--mu);
  border: 1px solid var(--bd); border-radius: 99px;
  font: inherit; font-size: 13px; cursor: pointer;
}
.ch2 span { margin-left: 6px; opacity: .7; }
.ch2.on { background: var(--tx); color: var(--card); border-color: var(--tx); }

.lg3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 12px; }
.lc { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; cursor: pointer; }
.lc:hover { border-color: var(--pr); }
.lc b { font-size: 15px; font-weight: 600; }
.lc p {
  margin: 0; color: var(--mu); font-size: 13px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.lt, .lf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lf { padding-top: 10px; border-top: 1px solid var(--bd); color: var(--mu); font-size: 12px; }

/* --- Detalle: estado, línea de tiempo y datos --- */
.sl { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; color: var(--mu); font-size: 12px; }

.tl { margin: 0 0 18px 8px; padding-left: 16px; border-left: 2px solid var(--bd); }
.tl div { position: relative; margin-bottom: 14px; }
.tl div::before {                      /* puntito de cada evento */
  content: ""; position: absolute; left: -27px; top: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: color-mix(in srgb, var(--pr) 22%, var(--card));
  border: 1px solid color-mix(in srgb, var(--pr) 35%, var(--card));
}
.tl div:not(:first-child)::before { background: color-mix(in srgb, var(--tx) 8%, var(--card)); border-color: var(--bd); }

dl { margin: 0; }
dt { margin-top: 12px; color: var(--mu); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
dd { margin: 2px 0 0; padding-bottom: 12px; font-weight: 600; border-bottom: 1px solid var(--bd); }
dd:last-child { padding-bottom: 0; border: 0; }

.info {
  display: flex; gap: 8px; margin-top: 16px; padding: 12px;
  background: color-mix(in srgb, var(--pr) 10%, var(--card));
  border: 1px solid color-mix(in srgb, var(--pr) 22%, var(--card));
  border-radius: 8px; color: var(--pr); font-size: 12px;
}
.info b { display: block; }
.info small { color: var(--tx); font-size: 12px; }

/* --- Historial: eventos agrupados por día --- */
.dh { margin: 22px 0 10px; color: var(--mu); font-size: 13px; font-weight: 600; }
.dh::first-letter { text-transform: uppercase; }
.tlx { margin-left: 15px; padding-left: 26px; border-left: 2px solid var(--bd); }
.te { position: relative; margin-bottom: 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; cursor: pointer; }
.te .ic { position: absolute; left: -44px; top: 8px; width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--bg); }
.tc { display: flex; flex-direction: column; gap: 2px; }
.tr { display: flex; justify-content: space-between; gap: 10px; }

/* --- Estadísticas: barras, dona, columnas y línea --- */
.br { display: grid; grid-template-columns: 130px 1fr 30px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 14px; }
.br i { height: 10px; overflow: hidden; background: var(--bd); border-radius: 5px; }
.br u { display: block; height: 100%; background: var(--pr); border-radius: 5px; }
.br b { text-align: right; }

.dn { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.lg { display: grid; gap: 6px; font-size: 13px; }
.lg i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 3px; }
.lg b { margin-left: 6px; }

.vc { display: flex; gap: 8px; align-items: flex-end; height: 170px; }
.vc > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
.vc u { display: block; width: 100%; max-width: 34px; min-height: 2px; background: var(--pr); border-radius: 5px 5px 0 0; }
.vc small { height: 24px; font-size: 10px; line-height: 1.2; text-align: center; }

/* ==========================================================================
   6. LOGIN / REGISTRO
   Con body.lo (logged out) se oculta la app y se muestra solo .au
   ========================================================================== */
.au { display: none; grid-column: 1 / -1; place-items: center; min-height: 100vh; padding: 24px; }
body.lo .au { display: grid; }
body.lo aside, body.lo .mw { display: none; }

.ac { width: min(420px, 100%); padding: 28px; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; }
.ac .logo { margin-bottom: 20px; color: var(--tx); }
.ac .logo i { border-color: var(--tx); }
.ac .logo small { color: var(--mu); }
.ac h1 { font-size: 24px; }
.ac .mu { margin: 0 0 18px; }
.ac .btn { width: 100%; padding: 11px; }

.alt { margin: 16px 0 0; color: var(--mu); font-size: 13px; text-align: center; }
.lk { padding: 0; background: none; border: 0; color: var(--pr); font: inherit; font-weight: 600; cursor: pointer; }
.pw { position: relative; }                       /* input de contraseña + botón Mostrar */
.pw button { position: absolute; right: 6px; top: 4px; padding: 6px; background: none; border: 0; color: var(--pr); font: inherit; font-size: 12px; cursor: pointer; }

/* ==========================================================================
   7. RESPONSIVE E IMPRESIÓN
   ========================================================================== */
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; }
  aside { position: static; flex-direction: row; align-items: center; height: auto; padding: 10px; overflow-x: auto; }
  .logo, .help { display: none; }
  nav { display: flex; gap: 4px; }
  nav a { white-space: nowrap; }
  .g3, .g2, .two { grid-template-columns: 1fr; }
  h1 { font-size: 25px; }
  .top { padding: 0 14px; }
  .sb { flex: 1; margin-right: 10px; }
  .us span:nth-child(2) { display: none; }     /* oculta el nombre del usuario */
  main { padding-top: 22px; }
}

@media print {
  aside, .btn, .noprint { display: none !important; }
  body { display: block; }
}
</style>
</head>

<body class="lo">

<!-- Pantalla de login / registro (se llena desde JS) -->
<div class="au" id="au"></div>

<!-- Barra lateral -->
<aside>
  <div class="logo">
    <i>363</i>
    <span><b>IPET N.º 363</b><small>Soporte técnico</small></span>
  </div>
  <nav>
    <a data-go="home"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
    <a data-go="list"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Solicitudes</a>
    <a data-go="hist"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</a>
    <a data-go="form"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva solicitud</a>
    <a data-go="stats"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estadísticas</a>
  </nav>
  <div class="help">
    <span class="q">?</span>
    <span><b>¿Necesitás ayuda?</b><small>Consultá con el área de informática.</small></span>
  </div>
</aside>

<!-- Contenido: barra superior + vista actual -->
<div class="mw">
  <header class="top">
    <div class="sb">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
      <input id="gq" type="search" placeholder="Buscar por problema, persona o lugar…" aria-label="Buscar">
    </div>
    <div class="us">
      <span class="av" id="uav"></span>
      <span><b id="unm"></b><small id="urol"></small></span>
      <button class="out" id="lout">Cerrar sesión</button>
    </div>
  </header>
  <main id="m"></main>
</div>

<script>
/* ==========================================================================
   1. CONSTANTES
   ========================================================================== */
const ESTADOS     = ["Pendiente", "En revisión", "En reparación", "Solucionado"];
const TIPOS       = ["Computadora", "Impresora", "Proyector", "Conectividad", "Teclado o mouse", "Software o sistema", "Otro"];
const LUGARES     = ["Aula 12", "Laboratorio 1", "Laboratorio 2", "Dirección", "Sala docente", "Preceptoría", "Biblioteca", "Taller"];
const PRIORIDADES = ["Alta", "Media", "Baja"];
const ROLES       = ["Docente", "Preceptoría", "Secretaría", "Soporte técnico", "Administración"];

// Claves de localStorage (no cambiarlas o se pierden los datos guardados)
const CLAVE_DATOS    = "soporte363_v2";
const CLAVE_USUARIOS = "soporte363_users";
const CLAVE_SESION   = "soporte363_session";

// Clase CSS de cada estado (define el color del badge)
const CLASE_ESTADO = { "Pendiente": "pen", "En revisión": "rev", "En reparación": "rep", "Solucionado": "sol" };

// Colores para los gráficos (mismo orden que ESTADOS y PRIORIDADES)
const COLORES_ESTADO    = ["var(--pen)", "var(--rev)", "var(--rep)", "var(--sol)"];
const COLORES_PRIORIDAD = ["var(--alta)", "var(--pen)", "var(--mu)"];

/* ==========================================================================
   2. ESTADO DE LA APP
   ========================================================================== */
let solicitudes = [];   // lista de solicitudes
let usuario = null;     // usuario con sesión iniciada
let vista = {           // vista actual
  nombre: "home",       // home | list | form | detail | hist | stats
  id: null,             // id de la solicitud abierta (detalle / edición)
  filtros: { q: "", estado: "", tipo: "", lugar: "", prio: "" }
};

/* ==========================================================================
   3. UTILIDADES
   ========================================================================== */
const $ = selector => document.querySelector(selector);

// Escapa texto para meterlo seguro en HTML
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const pad2 = n => String(n).padStart(2, "0");

// Fecha como "2026-10-27" (sirve para comparar días y para <input type=date>)
const ymd = t => {
  const d = new Date(t);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
};

// "Hoy, 14:30" / "Ayer, 09:10" / "25/10, 16:00"
function formatearFecha(t) {
  const d = new Date(t);
  const hora = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  const dia = ymd(t), ahora = Date.now();
  if (dia === ymd(ahora)) return "Hoy, " + hora;
  if (dia === ymd(ahora - 864e5)) return "Ayer, " + hora;
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + ", " + hora;
}

// "Hoy" / "Ayer" / "lunes, 26 de octubre" (títulos del historial)
function etiquetaDia(t) {
  const dia = ymd(t), ahora = Date.now();
  if (dia === ymd(ahora)) return "Hoy";
  if (dia === ymd(ahora - 864e5)) return "Ayer";
  return new Date(t).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
}

// Genera <option>s para un <select>; "placeholder" agrega la opción vacía
const opciones = (lista, seleccionado, placeholder) =>
  (placeholder ? `<option value="">${placeholder}</option>` : "") +
  lista.map(x => `<option${x === seleccionado ? " selected" : ""}>${esc(x)}</option>`).join("");

// Todos los eventos de todas las solicitudes, del más nuevo al más viejo
const todosLosEventos = () =>
  solicitudes.flatMap(r => r.hist.map(h => ({ ...h, r }))).sort((a, b) => b.ts - a.ts);

/* ==========================================================================
   4. DATOS: ejemplo inicial + guardado en localStorage
   ========================================================================== */
function datosDeEjemplo() {
  const ahora = Date.now(), H = 36e5, D = 24 * H;

  // "hace" = cuánto tiempo atrás (ms). hist = [[texto, quién, hace], ...]
  const crear = (id, titulo, solicitante, lugar, tipo, prioridad, estado, hace, desc, hist) => ({
    id, titulo, solicitante, lugar, tipo, prioridad, estado, desc,
    fecha: ahora - hace,
    hist: hist.map(([txt, who, h]) => ({ txt, who, ts: ahora - h }))
  });

  return [
    crear(1058, "El proyector no enciende", "Prof. Laura Gómez", "Aula 12", "Proyector", "Alta", "Pendiente", 5 * H,
      "No enciende desde esta mañana, la luz queda apagada.",
      [["Solicitud recibida y asignada", "Sistema", 5 * H], ["Diagnóstico inicial realizado", "Soporte técnico", 4 * H]]),
    crear(1057, "Sin conexión a internet", "Prof. Martín López", "Laboratorio 1", "Conectividad", "Media", "En revisión", 6 * H,
      "Ninguna computadora del laboratorio tiene internet.",
      [["Solicitud recibida y asignada", "Sistema", 6 * H], ["Estado cambiado a En revisión", "Soporte técnico", 5 * H]]),
    crear(1056, "Impresora sin tinta", "Secretaría", "Dirección", "Impresora", "Baja", "Solucionado", D + 2 * H,
      "Imprime en blanco.",
      [["Solicitud recibida y asignada", "Sistema", D + 2 * H], ["Se reemplazó el cartucho", "Soporte técnico", D], ["Estado cambiado a Solucionado", "Soporte técnico", D]]),
    crear(1055, "No puedo ingresar al sistema", "Prof. Ana Pérez", "Sala docente", "Software o sistema", "Media", "Solucionado", D + 5 * H,
      "La contraseña no es aceptada.",
      [["Solicitud recibida y asignada", "Sistema", D + 5 * H], ["Se restableció la contraseña", "Soporte técnico", D + 3 * H], ["Estado cambiado a Solucionado", "Soporte técnico", D + 3 * H]]),
    crear(1054, "Teclado con teclas trabadas", "Preceptoría", "Preceptoría", "Teclado o mouse", "Baja", "Pendiente", 2 * D,
      "Varias teclas se quedan pegadas.",
      [["Solicitud recibida y asignada", "Sistema", 2 * D]]),
    crear(1053, "Monitor con pantalla parpadeante", "Biblioteca", "Biblioteca", "Computadora", "Media", "En reparación", 3 * D,
      "La pantalla parpadea cada pocos segundos.",
      [["Solicitud recibida y asignada", "Sistema", 3 * D], ["Estado cambiado a En reparación", "Soporte técnico", 2 * D]])
  ];
}

function guardarSolicitudes() {
  try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(solicitudes)); } catch (x) {}
}

function cargarSolicitudes() {
  try {
    const guardado = localStorage.getItem(CLAVE_DATOS);
    if (guardado) { solicitudes = JSON.parse(guardado); return; }
  } catch (x) {}
  solicitudes = datosDeEjemplo();
}

const badgeEstado    = estado => `<span class="b ${CLASE_ESTADO[estado]}">${esc(estado)}</span>`;
const badgePrioridad = prio   => `<span class="b ${prio}">${prio}</span>`;

// Texto del evento según lo que pasó (para el historial general)
const tituloEvento = ev =>
  /^Solicitud recibida/.test(ev.txt)              ? "Solicitud creada" :
  /^Estado cambiado a Solucionado/.test(ev.txt)   ? "Solicitud resuelta" :
  /^Estado cambiado/.test(ev.txt)                 ? "Estado de solicitud actualizado" :
  ev.txt;

const iconoEvento = ev => /^Estado cambiado a Solucionado/.test(ev.txt) ? ICONOS["Solucionado"] : ICONOS["Pendiente"];

// Barra horizontal con la proporción de solicitudes por estado
function barraDeEstados() {
  const total = solicitudes.length || 1;
  const tramos = ESTADOS.map((estado, i) => {
    const n = solicitudes.filter(r => r.estado === estado).length;
    return n ? `<span style="width:${n / total * 100}%;background:${COLORES_ESTADO[i]}">${n}</span>` : "";
  }).join("");
  const leyenda = ESTADOS.map((estado, i) => `<span><i style="background:${COLORES_ESTADO[i]}"></i>${estado}</span>`).join("");
  return `<div class="sg" style="margin-top:14px">${tramos}</div><div class="lgr">${leyenda}</div>`;
}

// Tile chico (actividad reciente del inicio)
const tile = r => `
  <div class="tile" data-open="${r.id}">
    <div class="tt">
      <span class="ic">${r.estado === "En revisión" ? ICONOS["Pendiente"] : ICONOS[r.estado]}</span>
      ${badgeEstado(r.estado)}
    </div>
    <b>${esc(r.titulo)}</b>
    <small>SOL-${r.id} · ${esc(r.lugar)}</small>
    <div class="tf">${badgePrioridad(r.prioridad)}<small>${formatearFecha(r.fecha)}</small></div>

// Tarjeta de la lista de solicitudes
const tarjetaSolicitud = r => `
  <div class="lc" data-open="${r.id}">
    <div class="lt"><small>SOL-${r.id}</small>${badgeEstado(r.estado)}</div>
    <b>${esc(r.titulo)}</b>

    <div class="lf"><span>${esc(r.lugar)} · ${esc(r.tipo)}</span><span>${formatearFecha(r.fecha)}</span></div>
  </div>`;

// Historial general: eventos agrupados por día
function lineaDeTiempo(eventos) {
  const grupos = [];
  eventos.forEach(ev => {
    const dia = etiquetaDia(ev.ts);
    let g = grupos.find(x => x.dia === dia);
    if (!g) { g = { dia, items: [] }; grupos.push(g); }
    g.items.push(ev);
  });

  return grupos.map(g => `
    <h3 class="dh">${esc(g.dia)}</h3>
    <div class="tlx">${g.items.map(ev => `
      <div class="te" data-open="${ev.r.id}">
        <span class="ic">${iconoEvento(ev)}</span>
        <div class="tc">
          <div class="tr">
            <b>${esc(tituloEvento(ev))}</b>
            <small>${new Date(ev.ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}</small>
          </div>
          <span>${esc(ev.r.titulo)}</span>
          <small>SOL-${ev.r.id} · ${esc(ev.r.solicitante)} · ${esc(ev.who)}</small>
        </div>
      </div>`).join("")}
    </div>`).join("");
}

  },

  /* ---------- Estadísticas ---------- */
  stats() {
    // [[nombre, cantidad], ...] para una lista de valores posibles de un campo
    const contar = (campo, valores) => valores.map(v => [v, solicitudes.filter(r => r[campo] === v).length]);

    // Solicitudes creadas por día en los últimos 7 días
    const ultimos7 = [];
    for (let i = 6; i >= 0; i--) {
      const t = Date.now() - i * 864e5, d = new Date(t);
      ultimos7.push([pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1), solicitudes.filter(r => ymd(r.fecha) === ymd(t)).length]);
    }

    const leyenda = (datos, colores) =>
      `<div class="lg">${datos.map(([nombre, n], i) => `<div><i style="background:${colores[i]}"></i>${esc(nombre)} <b>${n}</b></div>`).join("")}</div>`;

    // Barras horizontales
    const barras = (titulo, datos) => {
      const max = Math.max(1, ...datos.map(d => d[1]));
      return `<div class="pn"><h2>${titulo}</h2>${datos.map(([nombre, n]) =>
        `<div class="br"><span>${esc(nombre)}</span><i><u style="width:${n / max * 100}%"></u></i><b>${n}</b></div>`).join("")}</div>`;
    };

    // Gráfico de dona (SVG con círculos y stroke-dasharray)
    const dona = (titulo, datos, colores) => {
      const total = datos.reduce((s, d) => s + d[1], 0);
      const C = 2 * Math.PI * 44;     // circunferencia
      let desplazamiento = 0;
      const arcos = datos.map(([, n], i) => {
        const largo = n / (total || 1) * C;
        const arco = `<circle cx="60" cy="60" r="44" fill="none" style="stroke:${colores[i]}" stroke-width="16" stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-desplazamiento}" transform="rotate(-90 60 60)"/>`;
        desplazamiento += largo;
        return arco;
      }).join("");
      return `<div class="pn"><h2>${titulo}</h2><div class="dn">
        <svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="${titulo}">
          <circle cx="60" cy="60" r="44" fill="none" style="stroke:var(--bd)" stroke-width="16"/>${arcos}
          <text x="60" y="58" text-anchor="middle" style="fill:var(--tx)" font-size="22" font-weight="600">${total}</text>
          <text x="60" y="73" text-anchor="middle" style="fill:var(--mu)" font-size="9">solicitudes</text>
        </svg>${leyenda(datos, colores)}</div></div>`;
    };

    // Barra única segmentada
    const segmentada = (titulo, datos, colores) => {
      const total = datos.reduce((s, d) => s + d[1], 0) || 1;
      return `<div class="pn"><h2>${titulo}</h2><div class="sg">${datos.map(([, n], i) =>
        n ? `<span style="width:${n / total * 100}%;background:${colores[i]}">${n}</span>` : "").join("")}</div>${leyenda(datos, colores)}</div>`;
    };

    // Columnas verticales
    const columnas = (titulo, datos) => {
      const max = Math.max(1, ...datos.map(d => d[1]));
      return `<div class="pn"><h2>${titulo}</h2><div class="vc">${datos.map(([nombre, n]) =>
        `<div><b>${n}</b><u style="height:${n / max * 100}px"></u><small>${esc(nombre)}</small></div>`).join("")}</div></div>`;
    };

    // Gráfico de línea
    const linea = (titulo, datos) => {
      const max = Math.max(1, ...datos.map(d => d[1])), ancho = 520;
      const puntos = datos.map(([nombre, n], i) => [40 + i * ancho / (datos.length - 1), 150 - n / max * 110, nombre, n]);
      const trazo = puntos.map(p => p[0] + "," + p[1]).join(" ");
      return `<div class="pn"><h2>${titulo}</h2>
        <svg viewBox="0 0 600 190" width="100%" role="img" aria-label="${titulo}">
          <line x1="30" y1="150" x2="570" y2="150" style="stroke:var(--bd)"/>
          <polygon points="40,150 ${trazo} ${40 + ancho},150" style="fill:var(--pr);opacity:.12"/>
          <polyline points="${trazo}" fill="none" style="stroke:var(--pr)" stroke-width="2.5" stroke-linejoin="round"/>
          ${puntos.map(p => `
            <circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:var(--card);stroke:var(--pr)" stroke-width="2"/>
            <text x="${p[0]}" y="${p[1] - 10}" text-anchor="middle" font-size="12" style="fill:var(--tx)">${p[3]}</text>
            <text x="${p[0]}" y="172" text-anchor="middle" font-size="11" style="fill:var(--mu)">${p[2]}</text>`).join("")}
        </svg></div>`;
    };

    const resueltas = solicitudes.filter(r => r.estado === "Solucionado").length;
    const porcentaje = solicitudes.length ? Math.round(resueltas / solicitudes.length * 100) : 0;

    return `
      <p class="k">Indicadores</p>
      <div class="hd">
        <div><h1>Estadísticas</h1><span class="mu">${solicitudes.length} solicitudes, ${porcentaje} % solucionadas.</span></div>
        <button class="btn sec" id="pr">Imprimir reporte</button>
      </div>
      <div class="g2">
        ${dona("Por estado", contar("estado", ESTADOS), COLORES_ESTADO)}
        ${segmentada("Por prioridad", contar("prioridad", PRIORIDADES), COLORES_PRIORIDAD)}
      </div>
      ${columnas("Por tipo de equipo", contar("tipo", TIPOS))}
      <div class="g2">
        ${barras("Por ubicación", contar("lugar", LUGARES).filter(d => d[1]))}
        ${linea("Solicitudes por día (últimos 7 días)", ultimos7)}
      </div>`;
  }
};

/* ==========================================================================
   7. LISTA: filtrado y actualización (sin redibujar toda la vista)
   ========================================================================== */
function filtrarSolicitudes() {
  const f = vista.filtros, q = f.q.toLowerCase().trim();
  return solicitudes
    .filter(r =>
      (!f.estado || r.estado === f.estado) &&
      (!f.tipo   || r.tipo === f.tipo) &&
      (!f.lugar  || r.lugar === f.lugar) &&
      (!f.prio   || r.prioridad === f.prio) &&
      (!q || [r.titulo, r.solicitante, r.lugar, r.tipo, r.desc, "sol-" + r.id].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => b.fecha - a.fecha);
}

function actualizarLista() {
  const lista = filtrarSolicitudes();
  $("#cnt").textContent = lista.length + (lista.length === 1 ? " solicitud encontrada" : " solicitudes encontradas");

  // Chips: "Todas" + uno por estado, con su contador
  $("#chips").innerHTML = ["", ...ESTADOS].map(estado => `
    <button type="button" class="ch2${vista.filtros.estado === estado ? " on" : ""}" data-st="${estado}">
      ${estado || "Todas"}<span>${estado ? solicitudes.filter(r => r.estado === estado).length : solicitudes.length}</span>
    </button>`).join("");

  $("#tbl").innerHTML = lista.length
    ? `<div class="lg3">${lista.map(tarjetaSolicitud).join("")}</div>`
    : '<p class="em">No hay solicitudes con esos filtros. Probá quitar alguno o creá una nueva.</p>';
}

/* ==========================================================================
   8. RENDER: dibuja la vista actual y conecta sus eventos
   ========================================================================== */
function render() {
  // Marca el ítem activo del menú (el detalle cuenta como "Solicitudes")
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.dataset.go === (vista.nombre === "detail" ? "list" : vista.nombre)));

  $("#m").className = "v-" + vista.nombre;
  $("#m").innerHTML = VISTAS[vista.nombre]();

  if (vista.nombre === "list") {
    actualizarLista();
    const conectarFiltro = (selector, campo) =>
      $(selector).addEventListener("change", ev => { vista.filtros[campo] = ev.target.value; actualizarLista(); });
    conectarFiltro("#ft", "tipo");
    conectarFiltro("#fl", "lugar");
    conectarFiltro("#fp", "prio");
  }

  if (vista.nombre === "form") {
    $("#fm").addEventListener("submit", ev => ev.preventDefault());
    $("#fb").addEventListener("click", guardarFormulario);
  }

  if (vista.nombre === "detail" && solicitudes.find(x => x.id === vista.id)) {
    // Cambiar estado
    $("#se").addEventListener("change", ev => {
      const r = solicitudes.find(x => x.id === vista.id);
      r.estado = ev.target.value;
      r.hist.push({ txt: "Estado cambiado a " + r.estado, who: "Soporte técnico", ts: Date.now() });
      guardarSolicitudes();
      render();
    });
    // Registrar una intervención
    $("#bi").addEventListener("click", () => {
      const texto = $("#ni").value.trim();
      if (!texto) { $("#ni").focus(); return; }
      solicitudes.find(x => x.id === vista.id).hist.push({ txt: texto, who: "Soporte técnico", ts: Date.now() });
      guardarSolicitudes();
      render();
    });
  }

  if (vista.nombre === "stats") {
    $("#pr").addEventListener("click", () => { try { window.print(); } catch (x) {} });
  }
}

/* ==========================================================================
   9. FORMULARIO: validar y guardar (crea o edita)
   ========================================================================== */
function guardarFormulario() {
  const datos = Object.fromEntries(new FormData($("#fm")));

  const faltantes = [
    ["fecha", "la fecha"], ["lugar", "el lugar"], ["tipo", "el tipo de equipo"],
    ["solicitante", "el solicitante"], ["titulo", "el título"], ["desc", "la descripción"]
  ].filter(([campo]) => !String(datos[campo] || "").trim());

  if (faltantes.length) {
    $("#err").textContent = "Falta completar: " + faltantes.map(x => x[1]).join(", ") + ".";
    return;
  }

  // Al editar se conserva la hora original; solo cambia el día elegido
  const existente = solicitudes.find(x => x.id === vista.id);
  const fecha = new Date(existente ? existente.fecha : Date.now());
  const [anio, mes, dia] = datos.fecha.split("-");
  fecha.setFullYear(+anio, mes - 1, +dia);

  const campos = {
    fecha: fecha.getTime(),
    lugar: datos.lugar,
    tipo: datos.tipo,
    solicitante: datos.solicitante.trim(),
    titulo: datos.titulo.trim(),
    desc: datos.desc.trim(),
    prioridad: datos.prioridad
  };

  if (existente) {
    Object.assign(existente, campos);
    existente.hist.push({ txt: "Solicitud editada", who: "Soporte técnico", ts: Date.now() });
  } else {
    const id = Math.max(1000, ...solicitudes.map(x => x.id)) + 1;
    solicitudes.push({
      id, ...campos, estado: "Pendiente",
      hist: [{ txt: "Solicitud recibida y asignada", who: "Sistema", ts: Date.now() }]
    });
    vista.id = id;
  }

  guardarSolicitudes();
  vista.nombre = "detail";
  render();
  scrollTo(0, 0);
}

/* ==========================================================================
   10. NAVEGACIÓN Y EVENTOS GLOBALES
   data-go="vista"      → ir a una vista
   data-open="id"       → abrir el detalle de una solicitud
   data-edit="id"       → editar una solicitud
   data-st="estado"     → filtrar la lista por estado (chips)
   ========================================================================== */
document.addEventListener("click", ev => {
  const chip = ev.target.closest("[data-st]");
  if (chip) { vista.filtros.estado = chip.dataset.st; actualizarLista(); return; }

  const el = ev.target.closest("[data-go],[data-open],[data-edit]");
  if (!el) return;

  if (el.dataset.open) {
    vista.nombre = "detail";
    vista.id = +el.dataset.open;
  } else if (el.dataset.edit) {
    vista.nombre = "form";
    vista.id = +el.dataset.edit;
  } else {
    const destino = el.dataset.go;
    if (destino === "form" && el.closest("nav,.hd")) vista.id = null;   // "Nueva solicitud" parte de cero
    vista.nombre = destino;
  }
  render();
  scrollTo(0, 0);
});

// Buscador de la barra superior: lleva a la lista y filtra en vivo
$("#gq").addEventListener("input", ev => {
  vista.filtros.q = ev.target.value;
  if (vista.nombre !== "list") { vista.nombre = "list"; render(); }
  else actualizarLista();
});

/* ==========================================================================
   11. USUARIOS: registro, login y sesión
   (las contraseñas se guardan hasheadas con SHA-256, nunca en texto plano)
   ========================================================================== */
const leerLS = clave => { try { return JSON.parse(localStorage.getItem(clave)); } catch (x) { return null; } };
const escribirLS = (clave, valor) => { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (x) {} };

async function hashear(texto) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
    return [...new Uint8Array(buf)].map(b => pad2(b.toString(16))).join("");
  } catch (x) {
    return btoa(unescape(encodeURIComponent(texto)));   // respaldo si no hay crypto.subtle
  }
}

// Entra a la app con un usuario ya validado
function entrar(u) {
  usuario = u;
  try { localStorage.setItem(CLAVE_SESION, JSON.stringify(u.mail)); } catch (x) {}
  $("#uav").textContent = u.n.split(/\s+/).map(p => p[0]).slice(0, 2).join("").toUpperCase();
  $("#unm").textContent = u.n;
  $("#urol").textContent = u.rol;
  document.body.classList.remove("lo");
  vista.nombre = "home";
  vista.id = null;
  render();
  scrollTo(0, 0);
}

// Pantalla de login (modo "in") o de registro (modo "reg")
function mostrarAuth(modo) {
  const registro = modo === "reg";

  $("#au").innerHTML = `
    <div class="ac">
      <div class="logo"><i>363</i><span><b>IPET N.º 363</b><small>Soporte técnico</small></span></div>
      <h1>${registro ? "Crear cuenta" : "Iniciar sesión"}</h1>
      <p class="mu">${registro ? "Completá tus datos para empezar a usar el sistema." : "Ingresá con tu cuenta para gestionar las solicitudes."}</p>
      <form id="af" novalidate>
        ${registro ? `<div class="f"><label for="u0">Nombre y apellido</label><input id="u0" name="nombre" autocomplete="name"></div>` : ""}
        <div class="f"><label for="u1">Correo electrónico</label><input id="u1" name="mail" type="email" autocomplete="username"></div>
        ${registro ? `<div class="f"><label for="ur">Rol</label><select id="ur" name="rol">${opciones(ROLES, "Docente")}</select></div>` : ""}
        <div class="f">
          <label for="u2">Contraseña</label>
          <div class="pw">
            <input id="u2" name="pass" type="password" autocomplete="${registro ? "new-password" : "current-password"}">
            <button type="button" id="tg">Mostrar</button>
          </div>
          ${registro ? "<small>Usa al menos 8 caracteres.</small>" : ""}
        </div>
        ${registro ? `<div class="f"><label for="u3">Repetir contraseña</label><input id="u3" name="pass2" type="password" autocomplete="new-password"></div>` : ""}
        <div class="err" id="ae" role="alert"></div>
        <button type="button" class="btn" id="ab">${registro ? "Crear cuenta" : "Iniciar sesión"}</button>
      </form>
      <p class="alt">${registro ? "¿Ya tenés cuenta?" : "¿No tenés cuenta?"} <button type="button" class="lk" id="sw">${registro ? "Iniciar sesión" : "Crear cuenta"}</button></p>
    </div>`;

  // Mostrar / ocultar contraseña
  $("#tg").addEventListener("click", () => {
    const input = $("#u2"), oculta = input.type === "password";
    input.type = oculta ? "text" : "password";
    $("#tg").textContent = oculta ? "Ocultar" : "Mostrar";
  });

  // Cambiar entre login y registro
  $("#sw").addEventListener("click", () => mostrarAuth(registro ? "in" : "reg"));

  // Enviar el formulario
  const enviar = async () => {
    const datos = Object.fromEntries(new FormData($("#af")));
    const usuarios = leerLS(CLAVE_USUARIOS) || [];
    const mail = (datos.mail || "").trim().toLowerCase();
    const error = texto => { $("#ae").textContent = texto; };

    if (!/^\S+@\S+\.\S+$/.test(mail)) return error("Ingresá un correo válido.");
    if (!datos.pass) return error("Ingresá la contraseña.");

    if (registro) {
      if (!datos.nombre.trim()) return error("Completá tu nombre y apellido.");
      if (datos.pass.length < 8) return error("La contraseña debe tener al menos 8 caracteres.");
      if (datos.pass !== datos.pass2) return error("Las contraseñas no coinciden.");
      if (usuarios.some(x => x.mail === mail)) return error("Ese correo ya está registrado. Iniciá sesión.");

      const nuevo = { n: datos.nombre.trim(), mail, rol: datos.rol, h: await hashear(mail + ":" + datos.pass) };
      usuarios.push(nuevo);
      escribirLS(CLAVE_USUARIOS, usuarios);
      entrar(nuevo);
    } else {
      const h = await hashear(mail + ":" + datos.pass);
      const encontrado = usuarios.find(x => x.mail === mail && x.h === h);
      if (!encontrado) return error("Correo o contraseña incorrectos.");
      entrar(encontrado);
    }
  };

  $("#ab").addEventListener("click", enviar);
  $("#af").addEventListener("submit", ev => ev.preventDefault());
  $("#af").addEventListener("keydown", ev => {
    if (ev.key === "Enter" && ev.target.tagName !== "BUTTON") { ev.preventDefault(); enviar(); }
  });
  $("#au input").focus();
}

/* ==========================================================================
   12. ARRANQUE
   ========================================================================== */
function iniciar() {
  const mailSesion = leerLS(CLAVE_SESION);
  const guardado = mailSesion && (leerLS(CLAVE_USUARIOS) || []).find(x => x.mail === mailSesion);

  $("#lout").addEventListener("click", () => {
    try { localStorage.removeItem(CLAVE_SESION); } catch (x) {}
    usuario = null;
    document.body.classList.add("lo");
    mostrarAuth("in");
  });

  if (guardado) entrar(guardado);   // sesión abierta: directo a la app
  else mostrarAuth("in");           // si no, pantalla de login
}

cargarSolicitudes();
iniciar();
</script>
